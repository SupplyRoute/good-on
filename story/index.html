  <script src="../script.js"></script>
  <script>
  (function () {
    var list = document.getElementById('list');
    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }
    function fmtDate(value) {
      var date = new Date(String(value || '') + 'T00:00:00');
      if (isNaN(date)) return String(value || '');
      return new Intl.DateTimeFormat('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(date);
    }
    function hrefOf(post) {
      var customUrl = typeof post.url === 'string' ? post.url.trim() : '';
      if (customUrl && !/^(?:[a-z]+:)?\/\//i.test(customUrl) && !/^javascript:/i.test(customUrl)) return customUrl;
      return 'post.html?id=' + encodeURIComponent(post.id || '');
    }
    function render(posts) {
      var validPosts = Array.isArray(posts) ? posts.filter(function (post) {
        return post && typeof post.id === 'string' && typeof post.title === 'string' && typeof post.date === 'string';
      }) : [];
      validPosts.sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
      list.replaceChildren();
      if (!validPosts.length) {
        list.appendChild(el('li', 'blog-state', '아직 올라온 이야기가 없습니다.'));
        list.setAttribute('aria-busy', 'false');
        return;
      }
      validPosts.forEach(function (post, index) {
        var item = el('li', 'blog-list-item');
        var link = el('a', 'blog-list-link');
        link.href = hrefOf(post);
        var number = el('span', 'blog-list-number', String(index + 1).padStart(2, '0'));
        number.setAttribute('aria-hidden', 'true');
        var copy = el('div', 'blog-list-copy');
        var time = el('time', null, fmtDate(post.date));
        time.dateTime = post.date;
        copy.append(time, el('h2', null, post.title));
        if (post.summary) copy.appendChild(el('p', null, String(post.summary)));
        var arrow = el('span', 'blog-list-arrow', '↗');
        arrow.setAttribute('aria-hidden', 'true');
        link.append(number, copy, arrow);
        item.appendChild(link);
        list.appendChild(item);
      });
      list.setAttribute('aria-busy', 'false');
    }
    fetch('posts.json', { cache: 'no-store' })
      .then(function (response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      })
      .then(render)
      .catch(function () {
        list.replaceChildren(el('li', 'blog-state blog-state-error', '글 목록을 불러오지 못했습니다. 잠시 후 새로고침해주세요.'));
        list.setAttribute('aria-busy', 'false');
      });
  }());
  </script>
