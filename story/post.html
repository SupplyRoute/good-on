<body class="blog-page blog-post-page">

    </a>
    <nav class="desktop-nav" aria-label="주요 메뉴">
      <a href="../index.html">홈</a>
      <a href="../products.html">제품</a>
      <a href="./" aria-current="page">이야기</a>
      <a href="../about.html">브랜드 소개</a>
      <a href="../contact.html">연락하기</a>
    </nav>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" data-menu-toggle onclick="toggleMobileMenu()">
      <span class="menu-label">메뉴</span>
      <span class="menu-lines" aria-hidden="true"><i></i><i></i></span>
    </button>
    <nav class="mobile-menu" id="mobile-menu" aria-label="모바일 메뉴" data-mobile-menu hidden>

  <main id="main" class="blog-post-main">
    <div class="blog-post-top"><a class="blog-back" href="./">← 이야기 목록</a></div>
    <div id="post-content" aria-live="polite" aria-busy="true">
      <p class="blog-state">이야기를 불러오는 중입니다.</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-logo" aria-label="Good on">GOOD<br>ON</div>
    <div class="footer-meta">
      <p>GOOD COLOR.<br>GOOD TEXTURE.<br>GOOD EVERYDAY.</p>
      <p>ONLINE CONTACT<br><a href="mailto:support@supplyroute.co.kr" target="_blank" rel="noopener noreferrer">support@supplyroute.co.kr</a><br><a href="https://www.instagram.com/supplyroute/" target="_blank" rel="noopener noreferrer">@supplyroute</a></p>
    </div>
    <p class="copyright">© <span data-year></span> GOOD ON. ALL RIGHTS RESERVED.</p>
  </footer>

  <script src="../script.js"></script>
  <script>
  (function () {
    var main = document.getElementById('post-content');
    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }
    function fmtDate(value) {
      var date = new Date(String(value || '') + 'T00:00:00');
      if (isNaN(date)) return String(value || '');
      return new Intl.DateTimeFormat('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(date);
    }
    function appendInline(parent, source) {
      var text = String(source || '');
      var pattern = /\[([^\]]+)\]\(([^)]+)\)/g;
      var cursor = 0;
      var match;
      while ((match = pattern.exec(text))) {
        parent.appendChild(document.createTextNode(text.slice(cursor, match.index)));
        var href = match[2].trim();
        if (/^(?:https:\/\/|\.\.?\/|[a-z0-9][a-z0-9._/-]*\.html(?:[?#].*)?$)/i.test(href)) {
          var link = el('a', 'blog-inline-link', match[1]);
          link.href = href;
          if (/^https:\/\//i.test(href)) { link.target = '_blank'; link.rel = 'noopener noreferrer'; }
          parent.appendChild(link);
        } else {
          parent.appendChild(document.createTextNode(match[0]));
        }
        cursor = pattern.lastIndex;
      }
      parent.appendChild(document.createTextNode(text.slice(cursor)));
    }
    function renderBody(source) {
      var box = el('div', 'blog-post-body');
      String(source || '').replace(/\r\n/g, '\n').split(/\n\s*\n/).forEach(function (block) {
        block = block.trim();
        if (!block) return;
        var lines = block.split('\n');
        if (lines.every(function (line) { return /^- /.test(line.trim()); })) {
          var list = el('ul');
          lines.forEach(function (line) {
            var item = el('li');
            appendInline(item, line.trim().slice(2));
            list.appendChild(item);
          });
          box.appendChild(list);
        } else if (/^## /.test(block)) {
          box.appendChild(el('h2', null, block.slice(3).trim()));
        } else {
          var paragraph = el('p');
          appendInline(paragraph, block);
          box.appendChild(paragraph);
        }
      });
      return box;
    }
    function hrefOf(post) {
      var customUrl = typeof post.url === 'string' ? post.url.trim() : '';
      if (customUrl && !/^(?:[a-z]+:)?\/\//i.test(customUrl) && !/^javascript:/i.test(customUrl)) return customUrl;
      return 'post.html?id=' + encodeURIComponent(post.id || '');
    }
    function setAttr(selector, attribute, value) {
      var node = document.querySelector(selector);
      if (node) node.setAttribute(attribute, value);
    }
    function addStructuredData(value) {
      var script = document.createElement('script');
      script.type = 'application/ld+json';
      script.textContent = JSON.stringify(value);
      document.head.appendChild(script);
    }
    function setMeta(post) {
      var title = String(post.title || '이야기');
      var description = String(post.description || post.summary || '').slice(0, 160);
      var url = location.origin + location.pathname + '?id=' + encodeURIComponent(post.id || '');
      var author = String(post.author || '').trim();
      document.title = title + ' — Good on';
      setAttr('meta[name="description"]', 'content', description);
      setAttr('meta[name="author"]', 'content', author);
      setAttr('link[rel="canonical"]', 'href', url);
      setAttr('meta[property="og:title"]', 'content', title);
      setAttr('meta[property="og:description"]', 'content', description);
      setAttr('meta[property="og:url"]', 'content', url);
      var article = {
        '@context': 'https://schema.org', '@type': 'BlogPosting', headline: title,
        description: description, datePublished: String(post.date || ''),
        dateModified: String(post.updated || post.date || ''), mainEntityOfPage: url,
        keywords: Array.isArray(post.tags) ? post.tags.map(String).join(', ') : ''
      };
      if (author) article.author = { '@type': 'Person', name: author };
      addStructuredData(article);
    }
    function notFound() {
      main.replaceChildren();
      var state = el('div', 'blog-notfound');
      state.append(el('p', 'eyebrow', 'STORY NOT FOUND'), el('h1', null, '글을 찾을 수 없습니다.'), el('p', null, '주소가 잘못되었거나 삭제된 글일 수 있습니다.'));
      var link = el('a', 'text-link', '이야기 목록으로 돌아가기 →');
      link.href = './';
      state.appendChild(link);
      main.appendChild(state);
      main.setAttribute('aria-busy', 'false');
    }
    function renderFaq(items) {
      var section = el('section', 'blog-faq');
      section.appendChild(el('h2', null, '자주 묻는 질문'));
      items.forEach(function (item) {
        var details = el('details');
        details.append(el('summary', null, String(item.q)), el('p', null, String(item.a)));
        section.appendChild(details);
      });
      return section;
    }
    function render(posts) {
      var id = new URLSearchParams(location.search).get('id') || new URLSearchParams(location.search).get('slug');
      var sorted = Array.isArray(posts) ? posts.slice().sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); }) : [];
      var index = sorted.findIndex(function (post) { return String(post.id) === id || (post.url && String(post.url).replace(/\.html$/, '') === id); });
      if (index < 0) { notFound(); return; }
      var post = sorted[index];
      setMeta(post);
      main.replaceChildren();
      var article = el('article', 'blog-article');
      var head = el('header', 'blog-post-head');
      var time = el('time', null, fmtDate(post.date));
      time.dateTime = String(post.date || '');
      head.append(time, el('h1', null, String(post.title || '(제목 없음)')));
      if (post.author || (post.updated && post.updated !== post.date)) {
        var meta = el('p', 'blog-post-meta');
        if (post.author) meta.appendChild(el('span', null, String(post.author)));
        if (post.updated && post.updated !== post.date) meta.appendChild(el('span', null, '수정 ' + fmtDate(post.updated)));
        head.appendChild(meta);
      }
      if (Array.isArray(post.tags) && post.tags.length) {
        var tags = el('div', 'blog-tags');
        post.tags.forEach(function (tag) { tags.appendChild(el('span', 'blog-tag', String(tag))); });
        head.appendChild(tags);
      }
      article.append(head, el('hr', 'blog-rule'), renderBody(post.body));
      var faq = Array.isArray(post.faq) ? post.faq.filter(function (item) { return item && item.q && item.a; }) : [];
      if (faq.length) article.appendChild(renderFaq(faq));
      var older = sorted[index + 1];
      var newer = sorted[index - 1];
      if (older || newer) {
        var nav = el('nav', 'blog-post-nav');
        nav.setAttribute('aria-label', '다른 이야기');
        [
          { post: older, className: 'blog-prev', label: '이전 글' },
          { post: newer, className: 'blog-next', label: '다음 글' }
        ].forEach(function (item) {
          if (!item.post) { nav.appendChild(el('span')); return; }
          var link = el('a', item.className);
          link.href = hrefOf(item.post);
          link.append(el('span', 'blog-post-dir', item.label), el('strong', null, String(item.post.title || '')));
          nav.appendChild(link);
        });
        article.appendChild(nav);
      }
      main.appendChild(article);
      main.setAttribute('aria-busy', 'false');
    }
    fetch('posts.json', { cache: 'no-store' })
      .then(function (response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      })
      .then(render)
      .catch(notFound);
  }());
  </script>
</body>
</html>
